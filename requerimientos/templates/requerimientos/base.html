<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>
        {% block title %}
        Levantamiento de Requerimientos
        {% endblock %}
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 15px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Levantamiento de Requerimientos</h1>

        <nav>
            <a href="/">Inicio</a>
            <a href="/nuevo/">Nuevo Requerimiento</a>
            <a href="/requerimientos/">Lista Requerimientos</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
