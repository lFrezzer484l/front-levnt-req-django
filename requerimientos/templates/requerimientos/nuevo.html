{% extends "requerimientos/base.html" %}

{% block title %}
Nuevo requerimiento
{% endblock %}

{% block content %}

<h2>Nuevo requerimiento</h2>

<form method="POST">

    {% csrf_token %}

    <label>Nombre del solicitante:</label>
    <input type="text" name="requester">

    <br><br>

    <label>Correo:</label>
    <input type="email" name="email">

    <br><br>

    <label>Título:</label>
    <select name="titulo">
        <option value="titulo1">TITULO 1</option>
        <option value="titulo2">TITULO 2</option>
    </select>

    <br><br>

    <label>Descripción:</label>
    <textarea name="description"></textarea>

    <br><br>

    <label>Tipo:</label>
    <select name="requirement_type">
        <option value="Desarrollo">Desarrollo</option>
        <option value="Soporte">Soporte</option>
        <option value="Mejora">Mejora</option>
    </select>

    <br><br>

    <label>Prioridad:</label>
    <select name="priority">
        <option value="Baja">Baja</option>
        <option value="Media">Media</option>
        <option value="Alta">Alta</option>
    </select>

    <br><br>

    <button type="submit">Registrar requerimiento</button>

</form>

{% endblock %}
